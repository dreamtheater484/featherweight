name: scan-release

# A release's files go to VirusTotal and Hybrid Analysis' sandbox (F1, docs/f1-plan.md "External
# review"). The keys are Roy's step 5 (the secrets VT_API_KEY and HA_API_KEY); until they're set, the
# report says it's waiting and nothing is uploaded. Every run keeps its report as the artifact
# "scan-report"; the 4.1 gate finds it with `scripts\scan-release.ps1 -FromCi` (any run on the commit).
# - release.yml calls it (workflow_call, `artifact: packages`) when it builds a tag, and on a dry run
#   asked to scan: the files are the same run's artifact, so the report is the release commit's.
#   Dry runs on every push don't scan (VirusTotal's and Hybrid Analysis' free limits, public reports).
# - A published release: the notes get a "Scans" section; the tag build's report is reused, so the
#   same files aren't uploaded twice.
# - By hand, for an earlier release once the keys are there.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      artifact:
        description: An artifact of the calling run whose files to scan (release.yml's "packages")
        type: string
        default: ''
      tag:
        description: Or a release (a draft too) whose assets to scan
        type: string
        default: ''
    secrets:
      VT_API_KEY:
        required: false
      HA_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release to scan (for example v4.1.0)
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write  # the release notes
      actions: read    # earlier runs' reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the calling run's files
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: scan-files

      - name: Scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ARTIFACT: ${{ inputs.artifact }}
          EVENT: ${{ github.event_name }}
        run: |
          if ($env:ARTIFACT) {
            $files = @(Get-ChildItem scan-files -Recurse -File -Include *.exe, *.zip, *.msi, *.msix | ForEach-Object FullName)
            scripts/scan-release.ps1 -Files $files -Tag $env:TAG
          } elseif ($env:EVENT -eq 'release') {
            scripts/scan-release.ps1 -Tag $env:TAG -Reuse -UpdateNotes
          } else {
            scripts/scan-release.ps1 -Tag $env:TAG -UpdateNotes
          }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report
          path: build/scan-release/
          if-no-files-found: ignore

name: scan-release

# A release's files go to VirusTotal and Hybrid Analysis' sandbox (F1, docs/f1-plan.md "External
# review"). The keys are Roy's step 5 (the secrets VT_API_KEY and HA_API_KEY); until they're set, the
# report says it's waiting and nothing is uploaded.
# - A published release: its assets are scanned and its notes get a "Scans" section with the links.
# - release.yml can call it (workflow_call) on its dry run's artifacts or on the draft, before
#   publishing: the run's commit is then the release commit, and the 4.1 gate fetches the result with
#   `scripts\scan-release.ps1 -FromCi` (build\scan-release\summary.json).
# - By hand, for an earlier release once the keys are there.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: A release (a draft too) whose assets to scan
        type: string
        default: ''
      run-id:
        description: Or a workflow run whose artifacts to scan
        type: string
        default: ''
    secrets:
      VT_API_KEY:
        required: false
      HA_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release to scan (for example v4.1.0)
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write  # the release notes
      actions: read    # a run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RUN_ID: ${{ inputs.run-id }}
          PUBLISHED: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        run: |
          $notes = @{}; if ($env:PUBLISHED -eq 'true') { $notes.UpdateNotes = $true }
          if ($env:RUN_ID) { scripts/scan-release.ps1 -Run $env:RUN_ID @notes }
          else { scripts/scan-release.ps1 -Tag $env:TAG @notes }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report
          path: build/scan-release/
          if-no-files-found: ignore

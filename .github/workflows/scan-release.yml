name: scan-release

# Each published release's files go to VirusTotal and Hybrid Analysis' sandbox (F1, docs/f1-plan.md
# "External review"), and the release notes get a "Scans" section with the reports' links. The keys
# are Roy's step 5 (the secrets VT_API_KEY and HA_API_KEY); until they're set, the report says it's
# waiting and nothing is uploaded. Run it by hand for an earlier release once the keys are there.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to scan (for example v4.1.0)
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write  # the release notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the release's files
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          HA_API_KEY: ${{ secrets.HA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: scripts/scan-release.ps1 -Tag $env:TAG -UpdateNotes

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report
          path: scan-report.*
          if-no-files-found: ignore

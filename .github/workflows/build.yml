name: build

# Builds and runs the unit tests, checks the size budgets, and fuzzes each parser for a minute,
# on every push. Packaging and releases happen locally (scripts/release.ps1), not on GitHub.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium
        uses: actions/cache@v4
        with:
          path: third_party/pdfium
          key: pdfium-${{ hashFiles('cmake/FetchPdfium.cmake') }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Round-trip and check the office corpus (fwtool)
        shell: pwsh
        run: |
          $fwtool = 'build\tools\fwtool\Release\fwtool.exe'
          & $fwtool roundtrip tests\office\generated tests\office\edge tests\office\layout; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $fwtool roundtrip --reserialize-all tests\office\generated tests\office\edge tests\office\layout; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $fwtool roundtrip --expect-reject tests\office\malicious; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $fwtool check tests\office\generated tests\office\edge tests\office\layout; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $fwtool check --expect-reject tests\office\broken; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Word documents saved through the model: no new errors in the Open XML SDK validator (plan §3).
      - name: Validate saved Word documents (Open XML SDK)
        shell: pwsh
        run: |
          $fwtool = 'build\tools\fwtool\Release\fwtool.exe'
          $files = 'tests\office\generated', 'tests\office\edge', 'tests\office\layout'
          & $fwtool roundtrip --model --out saved-copies @files; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tools\validate\Validate.csproj -c Release -o build\validate; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build\validate\fwvalidate.exe --saved saved-copies @files; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # D2's editing torture test, CI subset (plan §10): seeded random edits, a save, fwtool check,
      # the model reading it back, and the Open XML SDK validator, on the public corpus. Word's
      # repair check runs on the Office reference PC (scripts/torture.ps1 without -Ci).
      - name: Editing torture test (fwtool torture and the validator)
        shell: pwsh
        run: scripts\torture.ps1 -Ci

      - name: Upload the torture test's reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: torture
          path: |
            build/torture/summary.md
            build/torture/repro/
          if-no-files-found: ignore

      - name: Smoke test (render a PDF and a Word document off-screen)
        shell: pwsh
        run: |
          foreach ($f in 'tests\pdfs\text.pdf', 'tests\office\layout\report.docx') {
            Remove-Item smoke.png -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath build\Release\Featherweight.exe -ArgumentList '--snapshot','smoke.png',$f -PassThru -Wait
            if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.png)) { throw "snapshot of $f failed ($($p.ExitCode))" }
          }

      # The lightweight budgets (plan §11, tests/budgets/README.md), on the shipped configuration as
      # scripts/release.ps1 builds it: growth in size the ledger doesn't explain fails the build.
      # Timings are tracked, not gated: the runners are too noisy (the development PC gates them).
      - name: Configure the shipped configuration
        run: cmake -S . -B build-release -DFW_BUILD_TESTS=OFF -DFW_TEST_SCREENS=OFF

      - name: Build the shipped configuration
        run: cmake --build build-release --config Release --target Featherweight

      - name: Size against the ledger
        shell: powershell
        run: scripts\budgets.ps1 -Build build-release -Json budgets-size.json

      - name: Timings (tracked)
        continue-on-error: true
        shell: powershell
        run: scripts\budgets.ps1 -Build build-release -TrackTimings -Runs 3 -Fwtool build\tools\fwtool\Release\fwtool.exe -Json budgets.json

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budgets
          path: budgets*.json
          if-no-files-found: ignore

  fuzz:
    # Short fuzz runs (plan §10, §12): each target for 60 s, seeded from tests/fuzz/seeds and the
    # office corpus, with AddressSanitizer. A crash fails the job and uploads the input that caused
    # it. tests/fuzz/run-fuzzers.ps1 runs the same way locally.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium
        uses: actions/cache@v4
        with:
          path: third_party/pdfium
          key: pdfium-${{ hashFiles('cmake/FetchPdfium.cmake') }}

      - name: Configure
        run: cmake -S . -B build-fuzz -DFW_FUZZ=ON

      - name: Build the fuzz targets
        run: cmake --build build-fuzz --config RelWithDebInfo --parallel --target fuzz_zip fuzz_xml fuzz_opc fuzz_check fuzz_formula fuzz_docx fuzz_drawing fuzz_layout

      # VS 2022 links AddressSanitizer's runtime as a DLL: put its folder on the PATH.
      - name: Find the AddressSanitizer runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $bin = "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64"
          if (-not (Test-Path "$bin\clang_rt.asan_dynamic-x86_64.dll")) { throw "No AddressSanitizer runtime in $bin" }
          Add-Content $env:GITHUB_PATH $bin

      - name: Replay the seeds and regressions
        run: ctest --test-dir build-fuzz -C RelWithDebInfo -R fuzz_ --output-on-failure

      - name: Restore the inputs earlier runs found
        uses: actions/cache@v4
        with:
          path: fuzz-work
          key: fuzz-work-${{ github.run_id }}
          restore-keys: fuzz-work-

      - name: Fuzz each target for 60 s
        shell: pwsh
        run: tests/fuzz/run-fuzzers.ps1 -BuildDir build-fuzz -Seconds 60 -WorkDir fuzz-work -ArtifactDir fuzz-artifacts

      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-artifacts
          if-no-files-found: ignore

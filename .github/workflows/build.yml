name: build

# Builds and runs the unit tests on every push. Packaging and releases happen locally
# (scripts/release.ps1), not on GitHub.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PDFium
        uses: actions/cache@v4
        with:
          path: third_party/pdfium
          key: pdfium-${{ hashFiles('cmake/FetchPdfium.cmake') }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test (render a PDF off-screen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\Release\Featherweight.exe -ArgumentList '--snapshot','smoke.png','tests\pdfs\text.pdf' -PassThru -Wait
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.png)) { throw "snapshot failed ($($p.ExitCode))" }

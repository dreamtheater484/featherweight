name: release

# Builds a release in CI (f1-ship; docs/f1-plan.md, "releases are built in CI"): the shipped configuration for x64
# and ARM64, ctest, a second build on fresh runners that must give the same bytes, signing, the packages (portable
# zip, installer, per-machine MSI, MSIX), signtool verify on every file, the App Certification Kit on the MSIX,
# silent installs and uninstalls, the SBOM and SHA256SUMS.txt.
#
# Signing: through the SignPath Foundation once the repository has its secrets (Roy's step 1); until then with a
# throwaway test certificate made in the job, so every step still runs and nothing waits. Test-signed files are
# never published: on a tag the release job only drafts the release, and scripts/release.ps1 -Publish publishes it.
#
# Every push to main, claude/f1-int and claude/f1-ship runs it as a dry run (the 4.1 gate reads its result for the
# head). A v* tag also drafts the GitHub release.
on:
  push:
    branches: [main, claude/f1-int, claude/f1-ship]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The shipped configuration: the standard PDFium in the packages, the V8 build fetched as the separate
  # script engine asset (pdfium-v8.dll).
  FW_CONFIGURE: -DFW_BUILD_TESTS=ON -DFW_TEST_SCREENS=OFF -DFW_WITH_V8=OFF -DFW_PDFIUM_COMPONENT=ON

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64, runner: windows-2022 }
          - { arch: arm64, platform: ARM64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache PDFium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/pdfium
          key: pdfium-release-${{ matrix.arch }}-${{ hashFiles('cmake/FetchPdfium.cmake') }}
      - name: Configure
        run: cmake -S . -B build-release -A ${{ matrix.platform }} ${{ env.FW_CONFIGURE }}
      - name: Build
        run: cmake --build build-release --config Release
      - name: Unit tests
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Smoke test with the standard PDFium (no V8)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Snap([string]$exe, [string]$file) {
            Remove-Item smoke.png -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList '--snapshot', 'smoke.png', $file -PassThru -Wait
            if ($p.ExitCode -eq 0 -and (Test-Path smoke.png)) { return "ok" } else { return "failed ($($p.ExitCode))" }
          }
          $failed = @()
          foreach ($f in 'tests\pdfs\text.pdf', 'tests\pdfs\form.pdf', 'tests\office\layout\report.docx') {
            $r = Snap build-release\Release\Featherweight.exe $f
            Write-Host "$f : $r"
            if ($r -ne "ok") { $failed += $f }
          }
          if (-not $failed) { exit 0 }
          # A crash: its stack (cdb, at the second-chance exception), then the same file with the V8 build and with 4.0.
          $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\${{ matrix.arch }}\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          Set-Content cdb-commands.txt "sxd -c2 `"kn 60; .ecxr; kn 60; q`" av`ng"
          New-Item -ItemType Directory -Force v8test | Out-Null
          Copy-Item build-release\Release\Featherweight.exe v8test\
          Copy-Item build-release\Release\pdfium-v8.dll v8test\pdfium.dll
          gh release download v4.0.0 -R "${{ github.repository }}" -p "Featherweight-4.0.0-Portable.zip" -D v40 --clobber
          if (Test-Path v40\Featherweight-4.0.0-Portable.zip) { Expand-Archive v40\Featherweight-4.0.0-Portable.zip v40\app -Force }
          foreach ($f in $failed) {
            Write-Host "== $f"
            if ($cdb) {
              $p = Start-Process $cdb.FullName -ArgumentList '-G', '-lines', '-y', "$PWD\build-release\Release", '-cf', "$PWD\cdb-commands.txt",
                "$PWD\build-release\Release\Featherweight.exe", '--snapshot', "$PWD\smoke.png", "$PWD\$f" -NoNewWindow -PassThru -RedirectStandardOutput cdb.txt
              if (-not $p.WaitForExit(180000)) { $p.Kill() }
              Get-Content cdb.txt | Select-Object -Last 150 | Out-Host
            } else { Write-Host "No cdb on this runner" }
            Write-Host "with the V8 PDFium: $(Snap v8test\Featherweight.exe $f)"
            if (Test-Path v40\app\Featherweight.exe) { Write-Host "with 4.0.0: $(Snap v40\app\Featherweight.exe $f)" }
          }
          throw "snapshot failed: $($failed -join ', ')"
      - name: Stage the program files
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force stage
          Copy-Item build-release\Release\Featherweight.exe, build-release\Release\pdfium.dll, build-release\Release\pdfium-v8.dll $stage
          scripts\release-hashes.ps1 -Dir $stage -Out hashes-${{ matrix.arch }}.txt
          Get-Content hashes-${{ matrix.arch }}.txt
      - name: SBOM
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          if (Test-Path tools\sbom\make_sbom.py) {
            $dirs = Get-ChildItem third_party\pdfium -Directory | ForEach-Object { '--pdfium'; $_.FullName }
            python tools\sbom\make_sbom.py --out stage\featherweight.cdx.json @dirs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } else { Write-Host "tools\sbom\make_sbom.py isn't here yet (f1-trust): no SBOM" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.arch }}
          path: |
            stage/
            hashes-${{ matrix.arch }}.txt

  # Byte-identical builds: the same commit built again on a fresh runner. Compared without signatures (these are
  # the files before signing); docs/reproducible-builds.md says how anyone can check a release this way.
  reproducible:
    name: reproducible build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64, runner: windows-2022 }
          - { arch: arm64, platform: ARM64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build-release -A ${{ matrix.platform }} ${{ env.FW_CONFIGURE }}
      - name: Build the program
        run: cmake --build build-release --config Release --target Featherweight
      - name: Hash
        shell: pwsh
        run: |
          $stage = New-Item -ItemType Directory -Force stage
          Copy-Item build-release\Release\Featherweight.exe, build-release\Release\pdfium.dll, build-release\Release\pdfium-v8.dll $stage
          scripts\release-hashes.ps1 -Dir $stage -Out rebuilt-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-${{ matrix.arch }}
          path: rebuilt-${{ matrix.arch }}.txt

  reproducible-compare:
    name: reproducible (compare)
    needs: [build, reproducible]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{unsigned,rebuilt}-*'
      - name: The two builds give the same bytes
        shell: pwsh
        run: |
          $bad = 0
          foreach ($arch in 'x64', 'arm64') {
            $a = Get-Content "unsigned-$arch\hashes-$arch.txt"; $b = Get-Content "rebuilt-$arch\rebuilt-$arch.txt"
            Write-Host "== $arch"; $a | ForEach-Object { Write-Host "  $_" }
            if (Compare-Object $a $b) { Write-Host "::error::the $arch builds differ"; Compare-Object $a $b | Out-Host; $bad++ }
          }
          exit $bad

  # Signs the program files, builds the packages from them, signs those, and checks every signature.
  package:
    needs: build
    runs-on: windows-2022
    env:
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-*
      - name: Version
        id: version
        shell: pwsh
        run: |
          if ((Get-Content CMakeLists.txt -Raw) -notmatch 'project\(Featherweight VERSION (\d+\.\d+\.\d+)') { throw "no version" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Tools (Inno Setup and WiX, pinned)
        shell: pwsh
        run: packaging\ci-tools.ps1

      # --- Signing: SignPath when configured, else a test certificate made here ---
      - name: Test certificate
        if: env.SIGNPATH != 'true'
        shell: pwsh
        run: packaging\test-signing.ps1 -Make
      - name: Collect the program files to sign
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force to-sign | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            New-Item -ItemType Directory -Force "to-sign\$arch" | Out-Null
            Copy-Item "unsigned-$arch\stage\*.exe", "unsigned-$arch\stage\*.dll" "to-sign\$arch"
          }
      - name: Upload for SignPath
        if: env.SIGNPATH == 'true'
        id: to-sign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: to-sign
          path: to-sign/
      - name: Sign the program files (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: featherweight
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: program-files
          github-artifact-id: ${{ steps.to-sign.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Sign the program files (test certificate)
        if: env.SIGNPATH != 'true'
        shell: pwsh
        run: |
          Copy-Item -Recurse to-sign signed
          packaging\test-signing.ps1 -Sign (Get-ChildItem signed -Recurse -Include *.exe, *.dll).FullName
      - name: Packages
        shell: pwsh
        run: |
          $publisher = (Get-AuthenticodeSignature signed\x64\Featherweight.exe).SignerCertificate.Subject
          foreach ($arch in 'x64', 'arm64') {
            packaging\package.ps1 -Stage "signed\$arch" -Arch $arch -Version ${{ steps.version.outputs.version }} -Out dist `
              -MsixPublisher $publisher -Strict
          }
      - name: Upload packages for SignPath
        if: env.SIGNPATH == 'true'
        id: packages-to-sign
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-to-sign
          path: |
            dist/*Setup*.exe
            dist/*.msi
            dist/*.msix
      - name: Sign the packages (SignPath)
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: featherweight
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: packages
          github-artifact-id: ${{ steps.packages-to-sign.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Sign the packages (test certificate)
        if: env.SIGNPATH != 'true'
        shell: pwsh
        run: packaging\test-signing.ps1 -Sign (Get-ChildItem dist -File -Include *Setup*.exe, *.msi, *.msix -Recurse).FullName
      - name: signtool verify /pa on every file
        shell: pwsh
        run: |
          if ($env:SIGNPATH -ne 'true') { packaging\test-signing.ps1 -Trust }  # this runner only: it's thrown away
          packaging\test-signing.ps1 -Verify (Get-ChildItem dist -File -Include *.exe, *.dll, *.msi, *.msix -Recurse).FullName
      - name: Checksums and size
        shell: pwsh
        run: |
          if (Test-Path unsigned-x64\stage\featherweight.cdx.json) { Copy-Item unsigned-x64\stage\featherweight.cdx.json "dist\Featherweight-${{ steps.version.outputs.version }}.cdx.json" }
          scripts\release-hashes.ps1 -Dir dist -Out dist\SHA256SUMS.txt -Sums
          Get-ChildItem dist -File | Format-Table Name, Length -AutoSize | Out-Host
          $download = (Get-Item "dist\Featherweight-${{ steps.version.outputs.version }}-Setup.exe").Length
          Write-Host ("The download (the x64 installer): {0:N0} bytes, {1:N2} MB of 10" -f $download, ($download / 1MB))
          if ($env:SIGNPATH -ne 'true') { Copy-Item $env:RUNNER_TEMP\fw-test-signing\test-publisher.cer dist\ }
      # The package managers' manifests from this run's hashes (the gate's ship.manifests reads this artifact before
      # the release; release.ps1 -Publish writes the committed ones from the published release's).
      - name: Manifests (winget, Chocolatey, Scoop)
        shell: pwsh
        run: |
          packaging\manifests.ps1 -Version ${{ steps.version.outputs.version }} -Sums dist\SHA256SUMS.txt -Out manifests
          Get-ChildItem manifests -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifests
          path: manifests/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/

  # The Windows App Certification Kit on the x64 MSIX (the Store runs the same tests).
  msix-wack:
    name: msix (App Certification Kit)
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Run the App Certification Kit
        shell: pwsh
        run: packaging\msix-wack.ps1 -Dist dist

  # Silent installs and uninstalls on a fresh runner: the MSI per machine, the installer per machine and per user.
  install:
    name: install (silent, per machine and per user)
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Install, start and uninstall
        shell: pwsh
        run: packaging\install-test.ps1 -Dist dist

  # On a v* tag: the draft release with every file. scripts/release.ps1 -Publish publishes it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, reproducible-compare, msix-wack, install]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Remove-Item dist\test-publisher.cer -ErrorAction SilentlyContinue
          $notes = "docs\release-notes\$version.md"
          if (-not (Test-Path $notes)) { $notes = $null }
          $files = (Get-ChildItem dist -File).FullName
          $ghArgs = @($tag) + $files + @('--draft', '--title', "Featherweight $version", '--repo', "${{ github.repository }}")
          if ($notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += @('--notes', "Featherweight $version") }
          gh release create @ghArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
